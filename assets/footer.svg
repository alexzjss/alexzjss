<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status atual">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.5s} .a4{animation-delay:.7s} .a5{animation-delay:.9s} .a6{animation-delay:1.1s} .a7{animation-delay:1.3s} .a8{animation-delay:1.5s}
    @media (prefers-reduced-motion: reduce) { .draw,.fade { animation: none; } .draw{stroke-dashoffset:0} .fade{opacity:1} }

      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; }

  </style>
<line class="draw a1" x1="48" y1="30" x2="952" y2="30" stroke="var(--rule)" stroke-width="1"/>
<text class="mono fade a2" x="48" y="56" font-size="12" letter-spacing="1.5" fill="var(--bone)" text-anchor="start">STATUS — ESTUDANDO / CONSTRUINDO</text>
<text class="mono fade a3" x="48" y="78" font-size="11.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">provavelmente entre uma aula e um commit</text>
<text class="mono fade a4" x="952" y="78" font-size="11" letter-spacing="0.3" fill="var(--dim)" text-anchor="end">github.com/alexzjss ·· São Paulo, BR ·· © 2026</text>

</svg>