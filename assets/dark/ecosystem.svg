<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa do sistema">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.5s} .a4{animation-delay:.7s} .a5{animation-delay:.9s} .a6{animation-delay:1.1s} .a7{animation-delay:1.3s} .a8{animation-delay:1.5s}
    @media (prefers-reduced-motion: reduce) { .draw,.fade { animation: none; } .draw{stroke-dashoffset:0} .fade{opacity:1} }

  </style>
<text class="mono fade a1" x="48" y="30" font-size="12" letter-spacing="2" fill="var(--muted)" text-anchor="start">MAPA DO SISTEMA — DE UM ESTUDANTE, VáRIAS FRENTES</text>
<text class="mono fade a1" x="952" y="30" font-size="11" letter-spacing="2" fill="var(--dim)" text-anchor="end">FIG. 01</text>
<line class="draw a1" x1="48" y1="46" x2="952" y2="46" stroke="var(--rule)" stroke-width="1"/>
<circle class="fade a2" cx="500" cy="130" r="46" fill="none" stroke="var(--rule)" stroke-width="1"/>
<text class="mono fade a2" x="500" y="126" font-size="13" letter-spacing="1" fill="var(--bone)" text-anchor="middle">ALEX.SYS</text>
<text class="mono fade a2" x="500" y="144" font-size="9" letter-spacing="0.3" fill="var(--dim)" text-anchor="middle">estudante · dev · pesquisador</text>
<line class="draw a2" x1="500" y1="130" x2="160" y2="220" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3,4"/>
<text class="mono fade a2" x="160" y="214" font-size="10.5" letter-spacing="1.5" fill="var(--dim)" text-anchor="middle">WEB &amp; DADOS</text>
<text class="mono fade a2" x="160" y="232" font-size="10" letter-spacing="0.2" fill="var(--accent)" text-anchor="middle">dasiboard — workspace acadêmico</text>
<text class="mono fade a2" x="160" y="248" font-size="10" letter-spacing="0.2" fill="var(--accent)" text-anchor="middle">modaloop — geolocalização &amp; sustentabilidade</text>
<line class="draw a3" x1="500" y1="130" x2="500" y2="260" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3,4"/>
<text class="mono fade a3" x="500" y="254" font-size="10.5" letter-spacing="1.5" fill="var(--dim)" text-anchor="middle">IA &amp; PESQUISA</text>
<text class="mono fade a3" x="500" y="272" font-size="10" letter-spacing="0.2" fill="var(--accent)" text-anchor="middle">depuração de erros em BD — Java/JDBC</text>
<text class="mono fade a3" x="500" y="288" font-size="10" letter-spacing="0.2" fill="var(--accent)" text-anchor="middle">gems hype — Gemini Gems</text>
<line class="draw a4" x1="500" y1="130" x2="840" y2="220" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3,4"/>
<text class="mono fade a4" x="840" y="214" font-size="10.5" letter-spacing="1.5" fill="var(--dim)" text-anchor="middle">GAME DEV</text>
<text class="mono fade a4" x="840" y="232" font-size="10" letter-spacing="0.2" fill="var(--accent)" text-anchor="middle">rpg — virtual tabletop</text>
<line class="draw a5" x1="500" y1="130" x2="160" y2="60" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3,4"/>
<text class="mono fade a5" x="160" y="54" font-size="10.5" letter-spacing="1.5" fill="var(--dim)" text-anchor="middle">ENSINO &amp; ALGORITMOS</text>
<text class="mono fade a5" x="160" y="72" font-size="10" letter-spacing="0.2" fill="var(--accent)" text-anchor="middle">algoriCmos — gerador de exercícios C</text>
<line class="draw a6" x1="500" y1="130" x2="840" y2="60" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3,4"/>
<text class="mono fade a6" x="840" y="54" font-size="10.5" letter-spacing="1.5" fill="var(--dim)" text-anchor="middle">GESTÃO &amp; COMUNIDADE</text>
<text class="mono fade a6" x="840" y="72" font-size="10" letter-spacing="0.2" fill="var(--accent)" text-anchor="middle">DASI · Conway · Hype · Codelab · COSSI</text>
<text class="mono fade a8" x="48" y="300" font-size="9" letter-spacing="1.5" fill="var(--dim)" text-anchor="start">LINHAS TRACEJADAS — FRENTES EM PARALELO</text>

</svg>