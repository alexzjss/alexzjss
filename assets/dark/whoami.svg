<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sobre Alex">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.5s} .a4{animation-delay:.7s} .a5{animation-delay:.9s} .a6{animation-delay:1.1s} .a7{animation-delay:1.3s} .a8{animation-delay:1.5s}
    @media (prefers-reduced-motion: reduce) { .draw,.fade { animation: none; } .draw{stroke-dashoffset:0} .fade{opacity:1} }

  </style>
<text class="mono fade a1" x="48" y="34" font-size="15" letter-spacing="0" fill="var(--bone)" text-anchor="start">estudante de Sistemas de Informação na USP, São Paulo.</text>
<text class="mono fade a2" x="48" y="60" font-size="15" letter-spacing="0" fill="var(--muted)" text-anchor="start">transitando entre infraestrutura, ciência de dados e inteligência artificial — do back-end ao pipeline de dados.</text>
<text class="mono fade a3" x="48" y="86" font-size="15" letter-spacing="0" fill="var(--muted)" text-anchor="start">gosto de projetos que unem organização de sistemas complexos com dados aplicados à vida real.</text>
<line class="draw a4" x1="48" y1="92" x2="952" y2="92" stroke="var(--rule)" stroke-width="1"/>
<text class="mono fade a4" x="48" y="118" font-size="11" letter-spacing="2" fill="var(--muted)" text-anchor="start">FOCO</text>
<text class="mono fade a4" x="350" y="118" font-size="11" letter-spacing="2" fill="var(--muted)" text-anchor="start">STATUS</text>
<text class="mono fade a4" x="660" y="118" font-size="11" letter-spacing="2" fill="var(--muted)" text-anchor="start">CLUBES &amp; ORGANIZAÇÕES</text>
<text class="mono fade a5" x="48" y="140" font-size="12.5" letter-spacing="0.5" fill="var(--accent)" text-anchor="start">Infraestrutura</text>
<text class="mono fade a5" x="48" y="160" font-size="12.5" letter-spacing="0.5" fill="var(--accent)" text-anchor="start">Ciência de Dados</text>
<text class="mono fade a5" x="48" y="180" font-size="12.5" letter-spacing="0.5" fill="var(--accent)" text-anchor="start">Inteligência Artificial</text>
<text class="mono fade a5" x="48" y="200" font-size="12.5" letter-spacing="0.5" fill="var(--accent)" text-anchor="start">Full-Stack Web</text>
<text class="mono fade a6" x="350" y="140" font-size="12.5" letter-spacing="0.5" fill="var(--accent)" text-anchor="start">aberto a estágio</text>
<text class="mono fade a6" x="350" y="160" font-size="12.5" letter-spacing="0.5" fill="var(--accent)" text-anchor="start">pesquisa acadêmica</text>
<text class="mono fade a6" x="350" y="180" font-size="12.5" letter-spacing="0.5" fill="var(--accent)" text-anchor="start">colaboração em projetos</text>
<text class="mono fade a7" x="660" y="140" font-size="12" letter-spacing="0.3" fill="var(--accent)" text-anchor="start">DASI USP — organizador de projetos de TI</text>
<text class="mono fade a7" x="660" y="160" font-size="12" letter-spacing="0.3" fill="var(--accent)" text-anchor="start">Conway USP — organizador de projetos em game dev</text>
<text class="mono fade a7" x="660" y="180" font-size="12" letter-spacing="0.3" fill="var(--accent)" text-anchor="start">Hype USP — pesquisa em dados &amp; IA</text>
<text class="mono fade a7" x="660" y="200" font-size="12" letter-spacing="0.3" fill="var(--accent)" text-anchor="start">Codelab Leste — desenvolvedor full-stack</text>
<text class="mono fade a7" x="660" y="220" font-size="12" letter-spacing="0.3" fill="var(--accent)" text-anchor="start">COSSI — gestão comercial e financeira</text>

</svg>