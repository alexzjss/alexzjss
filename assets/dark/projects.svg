<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 740" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Projetos">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.5s} .a4{animation-delay:.7s} .a5{animation-delay:.9s} .a6{animation-delay:1.1s} .a7{animation-delay:1.3s} .a8{animation-delay:1.5s}
    @media (prefers-reduced-motion: reduce) { .draw,.fade { animation: none; } .draw{stroke-dashoffset:0} .fade{opacity:1} }

  </style>
<text class="mono fade a1" x="48" y="30" font-size="12" letter-spacing="2" fill="var(--muted)" text-anchor="start">PROJETOS SELECIONADOS</text>
<text class="mono fade a1" x="952" y="30" font-size="11" letter-spacing="2" fill="var(--dim)" text-anchor="end">FIG. 02</text>
<line class="draw a1" x1="48" y1="46" x2="952" y2="46" stroke="var(--rule)" stroke-width="1"/>
<text class="mono fade a2" x="48" y="90" font-size="15" letter-spacing="0.5" fill="var(--bone)" text-anchor="start">01 / DASIBOARD</text>
<text class="mono fade a2" x="48" y="114" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Workspace acadêmico completo para estudantes de Sistemas de Informação da USP — meu maior projeto.</text>
<text class="mono fade a2" x="48" y="134" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Kanban de tarefas, notas e frequência, calendário de eventos, salas de estudo colaborativas, perfil com conquistas e fluxograma curricular interativo.</text>
<text class="mono fade a2" x="48" y="158" font-size="10.5" letter-spacing="1" fill="var(--dim)" text-anchor="start">TYPESCRIPT · WEB APP · ACADEMIC TOOLS · DASIBOARD.ONLINE</text>
<line class="draw a3" x1="48" y1="176" x2="952" y2="176" stroke="var(--rule)" stroke-width="1"/>
<text class="mono fade a3" x="48" y="200" font-size="15" letter-spacing="0.5" fill="var(--bone)" text-anchor="start">02 / RPG</text>
<text class="mono fade a3" x="48" y="224" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Virtual tabletop com combate automatizado para mesas de RPG.</text>
<text class="mono fade a3" x="48" y="244" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Gerenciamento de mesas, campanhas e jogadores, com apresentação visual integrada à sessão.</text>
<text class="mono fade a3" x="48" y="268" font-size="10.5" letter-spacing="1" fill="var(--dim)" text-anchor="start">TYPESCRIPT · VIRTUAL TABLETOP · GAME DEV</text>
<line class="draw a4" x1="48" y1="286" x2="952" y2="286" stroke="var(--rule)" stroke-width="1"/>
<text class="mono fade a4" x="48" y="310" font-size="15" letter-spacing="0.5" fill="var(--bone)" text-anchor="start">03 / MODALOOP</text>
<text class="mono fade a4" x="48" y="334" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Plataforma web que conecta pessoas a pontos de coleta de roupas usadas.</text>
<text class="mono fade a4" x="48" y="354" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Geolocalização, informações ambientais e acesso facilitado a locais de reciclagem e reaproveitamento têxtil.</text>
<text class="mono fade a4" x="48" y="378" font-size="10.5" letter-spacing="1" fill="var(--dim)" text-anchor="start">TYPESCRIPT · GEOLOCATION · SUSTAINABILITY</text>
<line class="draw a5" x1="48" y1="396" x2="952" y2="396" stroke="var(--rule)" stroke-width="1"/>
<text class="mono fade a5" x="48" y="420" font-size="15" letter-spacing="0.5" fill="var(--bone)" text-anchor="start">04 / DEPURAÇÃO DE ERROS EM BD</text>
<text class="mono fade a5" x="48" y="444" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Pesquisa em andamento sobre detecção e depuração de erros em bancos de dados.</text>
<text class="mono fade a5" x="48" y="464" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Explora estratégias de diagnóstico de falhas de acesso e integridade de dados usando Java e JDBC.</text>
<text class="mono fade a5" x="48" y="488" font-size="10.5" letter-spacing="1" fill="var(--dim)" text-anchor="start">JAVA · JDBC · DATABASES · RESEARCH</text>
<line class="draw a6" x1="48" y1="506" x2="952" y2="506" stroke="var(--rule)" stroke-width="1"/>
<text class="mono fade a6" x="48" y="530" font-size="15" letter-spacing="0.5" fill="var(--bone)" text-anchor="start">05 / ALGORICMOS</text>
<text class="mono fade a6" x="48" y="554" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Gerador de exercícios aleatórios, em português, para estudo de programação.</text>
<text class="mono fade a6" x="48" y="574" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Cobre Programação em C, análise de algoritmos e estruturas de dados para prática acadêmica.</text>
<text class="mono fade a6" x="48" y="598" font-size="10.5" letter-spacing="1" fill="var(--dim)" text-anchor="start">PYTHON · EDUCATION · ALGORITHMS</text>
<line class="draw a7" x1="48" y1="616" x2="952" y2="616" stroke="var(--rule)" stroke-width="1"/>
<text class="mono fade a7" x="48" y="640" font-size="15" letter-spacing="0.5" fill="var(--bone)" text-anchor="start">06 / GEMS HYPE</text>
<text class="mono fade a7" x="48" y="664" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Projeto construído para o Hackathon do Hype USP.</text>
<text class="mono fade a7" x="48" y="684" font-size="12.5" letter-spacing="0" fill="var(--muted)" text-anchor="start">Assistentes de IA customizados usando Gems do Gemini para casos de uso acadêmicos.</text>
<text class="mono fade a7" x="48" y="708" font-size="10.5" letter-spacing="1" fill="var(--dim)" text-anchor="start">GEMINI · AI · HACKATHON · HYPE USP</text>

</svg>