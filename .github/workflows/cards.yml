name: cards
on:
  schedule:
    - cron: '30 3 * * 1'   # weekly, Monday
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh commit counts and languages, rebuild cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/refresh.py
          python3 scripts/cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data.json assets/card-*.svg
          git diff --cached --quiet || git commit -m "chore: refresh project cards" && git push
