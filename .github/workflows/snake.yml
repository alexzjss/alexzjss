name: snake
on:
  schedule:
    - cron: '0 4 * * *'   # depois do bonsai
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#79c0ff&color_dots=#0a1220,#12305a,#1f4f8a,#4f86c0,#79c0ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake
          build_dir: dist
          commit_message: 'chore: feed the snake 🐍'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
